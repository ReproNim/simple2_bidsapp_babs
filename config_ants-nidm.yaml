# This is a config yaml file for ANTs BIDS App
# BABS project layout (requires a BABS revision containing PennLINC/babs#369)
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

# Input datasets configuration
input_datasets:
    BIDS:
        required_files:
            - "anat/*_T1w.nii*"
        is_zipped: false
        origin_url: "${BIDS_ORIGIN}"
        path_in_babs: sourcedata/BIDS
    NIDM:
        required_files:
            - "nidm.ttl"
        is_zipped: false
        origin_url: "${NIDM_ORIGIN}"
        path_in_babs: sourcedata/NIDM
# Arguments passed to the application inside the container
bids_app_args:
    $SUBJECT_SELECTION_FLAG: "--participant-label"
    --num-threads: "16"
    # The BABS-mounted BIDS input is a datalad sparse checkout of a single
    # subject, which pybids' validator rejects; the app finds its own T1w.
    --skip-bids-validation: ""
    # NIDM is picked up automatically from <bids_dir>/../NIDM, i.e. the mounted
    # sourcedata/NIDM input dataset. No flag needed.
# ${TMPDIR_HOST} is substituted from the environment by
# babs_prepare_yaml_config and must match the path bound below: Singularity
# refuses to use a TMPDIR that is not visible inside the container.
singularity_args:
    - --home
    - ${TMPDIR_HOST}
    - -B
    - ${TMPDIR_HOST}:${TMPDIR_HOST}
    - -B
    - ${TMPDIR_HOST}:/tmp
    # --nv is MANDATORY, not tuning. Every registration in the app is FireANTs
    # on CUDA, and the app raises DeviceUnavailable at construction when no GPU
    # is visible -- deliberately, with no CPU fallback. Without --nv the GPU is
    # invisible inside the container and every job in the array fails
    # identically. Pairs with --gres=gpu:1 in cluster_resources below; either
    # one alone is useless.
    - --nv
    #- --userns
    #- --no-home
    - --writable-tmpfs
# Output foldername(s) to be zipped. The app writes <output>/sub-<id>/... with
# no app-name wrapper (per-subject layout, sensein/ants_bidsapp#9). ${subid} is
# NOT substituted by babs_prepare_yaml_config (only vars passed to it are); it
# survives into the rendered participant_job.sh where bash defines ${subid} at
# runtime, so each job zips its own subject folder:
# sub-<id>_sub-<id>-<version>.zip, e.g. sub-<id>_sub-<id>-0-2-0.zip.
# The version IS substituted (ZIP_VERSION, which the wrapper derives from
# ANTS_VERSION), so the zip name always matches the image that ran.
zip_foldernames:
    ${subid}: "${ZIP_VERSION}"
# How much cluster resources it needs:
cluster_resources:
    interpreting_shell: "/bin/bash"
    # Partition/qos/account are site-specific -- check with
    # `scontrol show partition <name>` before changing them.
    #
    # --no-requeue is MANDATORY on any partition that preempts with
    # PreemptMode=REQUEUE: a requeued job keeps its SLURM job id, so
    # participant_job.sh recomputes the SAME
    # BRANCH="job-${SLURM_ARRAY_JOB_ID}-${SLURM_ARRAY_TASK_ID}-${subid}" and hits
    # its bare `mkdir "${BRANCH}"` (no -p) against the directory the killed
    # attempt left behind. The `trap cleanup EXIT` cannot save it: SIGKILL
    # bypasses EXIT traps and GraceTime=0 leaves no window. Harmless on a
    # partition that never preempts, so it stays regardless of partition.
    #
    # cpus/mem/time sized from the first gate-passing run (aug27c pilot, job
    # 21427403_1, sub-0051456): Elapsed 1:25:12, MaxRSS 17.9 GB at 16 threads.
    # 32G is ~1.8x measured headroom (JLF memory tracks brain-mask size, which
    # varies by subject). The wrongly-masked aug26/aug27 runs needed 25.5 GB
    # because they fused over whole-head masks; a correct mask needs less.
    # 24:00:00 is far above the 1:25 measured -- it is a ceiling, not an
    # estimate, and does not make the job run longer.
    customized_text: |
        #SBATCH --partition=condo
        #SBATCH --qos=condo
        #SBATCH --account=csd841
        #SBATCH --no-requeue
        #SBATCH --cpus-per-task=8
        #SBATCH --mem=32G
        #SBATCH --time=24:00:00
        #SBATCH --job-name=ants-nidm_bidsapp_${RUN_DATE}
# Necessary commands to be run first. This runs on the COMPUTE side
# (participant_job.sh), which only needs datalad/git-annex/apptainer -- not the
# babs CLI itself, so the plain `babs` env is fine here. The login-side env used
# for `babs init`/`babs submit` is set by babs_common.sh (BABS_ENV, default `babs`).
script_preamble: |
    source ~/.bashrc
    micromamba activate babs
    module load singularitypro/3.11
    export SINGULARITYENV_DATALAD_SSH_SOCKETDIR=${TMPDIR_HOST}
    export SINGULARITYENV_TMPDIR=${TMPDIR_HOST}
# Where to run the jobs:
job_compute_space: "${COMPUTE_SPACE}"
required_files:
    "$INPUT_DATASET_#1":
        - "anat/*_T1w.nii*"
# Messages the app writes when a job fails, for reading a failed job's logs.
# The BABS version these scripts pin (ea5d6f0) does not read this block, and
# babs status judges a job by its scheduler state and whether results were
# saved. The apps log to stderr, which BABS writes to logs/<job>.e<id>,
# separate from stdout (.o<id>).
alert_log_messages:
    stdout:
        - "ERROR:"
        - "Cannot allocate memory"
        - "Numerical result out of range"
        - "Segmentation failed"
        - "Error in NIDM conversion"
        - "Required file not found"
    stderr:
        # No visible GPU: --nv or --gres=gpu:1 missing, or a faulty GPU node.
        - "DeviceUnavailable"
        # NIDM input is an annexed file that was never `datalad get`-ed.
        - "no content behind it"
