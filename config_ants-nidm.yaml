# This is a config yaml file for ANTs BIDS App
# BABS project layout (requires a BABS revision containing PennLINC/babs#369)
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

# Input datasets configuration
input_datasets:
    BIDS:
        required_files:
            - "anat/*_T1w.nii*"
        is_zipped: false
        origin_url: "${BIDS_ORIGIN}"
        path_in_babs: sourcedata/BIDS
    NIDM:
        required_files:
            - "nidm.ttl"
        is_zipped: false
        origin_url: "${NIDM_ORIGIN}"
        path_in_babs: sourcedata/NIDM
# Arguments passed to the application inside the container
bids_app_args:
    $SUBJECT_SELECTION_FLAG: "--participant-label"
    --num-threads: "16"
    # The BABS-mounted BIDS input is a datalad sparse checkout of a single
    # subject, which pybids' validator rejects; the app finds its own T1w.
    --skip-bids-validation: ""
    # NIDM is picked up automatically from <bids_dir>/../NIDM, i.e. the mounted
    # sourcedata/NIDM input dataset. No flag needed.
singularity_args:
    - --userns
    - --no-home
    - --writable-tmpfs
# Output foldername(s) to be zipped. The app writes <output>/sub-<id>/... with
# no app-name wrapper (per-subject layout, sensein/ants_bidsapp#9). ${subid} is
# NOT substituted by babs_prepare_yaml_config (only vars passed to it are); it
# survives into the rendered participant_job.sh where bash defines ${subid} at
# runtime, so each job zips its own subject folder:
# sub-<id>_sub-<id>-0-1-0.zip.
zip_foldernames:
    ${subid}: "0-1-0"
# How much cluster resources it needs:
cluster_resources:
    interpreting_shell: "/bin/bash"
    # mit_preemptable: 591 nodes and a 2-day ceiling, versus mit_normal's 50
    # nodes and 12h. The throughput difference is the reason to be here.
    #
    # --no-requeue is MANDATORY on this partition, not optional tuning.
    # mit_preemptable has PreemptMode=REQUEUE and GraceTime=0. A requeued job
    # keeps its SLURM job id, so participant_job.sh recomputes the SAME
    # BRANCH="job-${SLURM_ARRAY_JOB_ID}-${SLURM_ARRAY_TASK_ID}-${subid}" and then
    # hits its bare `mkdir "${BRANCH}"` (line 47, no -p) against the directory
    # the killed attempt left behind -- a guaranteed failure. The script does
    # register `trap cleanup EXIT` to remove that directory, but an untrapped
    # SIGTERM/SIGKILL bypasses an EXIT trap, and GraceTime=0 leaves no window
    # anyway. The freesurfer aug20 run lost sub-0051457 exactly this way.
    #
    # With --no-requeue, SLURM cancels instead of requeueing (PreemptMode=REQUEUE
    # requeues only jobs that permit it). Preemption then becomes a clean job
    # failure, and `babs submit` retries it under a NEW array job id -- hence a
    # new BRANCH and no collision. Expect some jobs to need resubmission; that is
    # the trade for the extra nodes.
    #
    # cpus/mem: PILOT VALUES, to be re-sized from measured MaxRSS/Elapsed once a
    # subject completes (no correct ANTs run has finished through BABS yet). 16
    # threads because joint label fusion registers 20 atlases; 48G because ITK
    # allocates per-thread buffers and the earlier 32G was sized for 8 threads.
    # time: 12:00:00 retained -- the partition now allows up to 2 days, but the
    # one completed (if wrongly-masked) run took 1h23m, so 12h is already ample
    # and a shorter request schedules sooner.
    customized_text: |
        #SBATCH --partition=mit_preemptable
        #SBATCH --no-requeue
        #SBATCH --cpus-per-task=16
        #SBATCH --mem=48G
        #SBATCH --time=12:00:00
        #SBATCH --job-name=ants-nidm_bidsapp_${RUN_DATE}
# Necessary commands to be run first. This runs on the COMPUTE side
# (participant_job.sh), which only needs datalad/git-annex/apptainer -- not the
# babs CLI itself, so the plain `babs` env is fine here. The login-side env used
# for `babs init`/`babs submit` is set by babs_common.sh (BABS_ENV, default `babs`).
script_preamble: |
    source ~/.bashrc
    micromamba activate babs
    module load apptainer
# Where to run the jobs:
job_compute_space: "${COMPUTE_SPACE}"
required_files:
    "$INPUT_DATASET_#1":
        - "anat/*_T1w.nii*"
# Alert messages that might be found in log files of failed jobs:
alert_log_messages:
    stdout:
        - "ERROR:"
        - "Cannot allocate memory"
        - "Numerical result out of range"
        - "Segmentation failed"
        - "Error in NIDM conversion"
        - "Required file not found"
