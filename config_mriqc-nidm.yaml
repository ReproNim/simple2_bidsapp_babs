# This is a config yaml file for MRIQC BIDS App
# BABS project layout (requires a BABS revision containing PennLINC/babs#369)
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

# Input datasets configuration
input_datasets:
    BIDS:
        required_files:
            - "anat/*_T1w.nii*"
        is_zipped: false
        origin_url: "${BIDS_ORIGIN}"
        path_in_babs: sourcedata/BIDS
    NIDM:
        required_files:
            - "nidm.ttl"
        is_zipped: false
        origin_url: "${NIDM_ORIGIN}"
        path_in_babs: sourcedata/NIDM
# Arguments passed to the application inside the container
bids_app_args:
    $SUBJECT_SELECTION_FLAG: "--participant-label"
    --mem: "16G"
    --nprocs: "12"
    --omp-nthreads: "8"
singularity_args:
    - --userns
    - --no-home
    - --writable-tmpfs
# Output foldername(s) to be zipped:
zip_foldernames:
    mriqc-nidm_bidsapp: "0-1-0"
# How much cluster resources it needs:
cluster_resources:
    interpreting_shell: "/bin/bash"
    # Do NOT use mit_preemptable: a preempted BABS job is guaranteed to fail on
    # requeue, because participant_job.sh does a bare `mkdir "${BRANCH}"` (no -p)
    # and the branch dir already exists from the killed attempt. The sibling
    # freesurfer app hit exactly this on its aug20 run.
    #
    # mem/time below are FIRST-RUN ESTIMATES, not measured: no completed run of
    # this app exists yet. They deliberately over-request, because on mit_normal
    # an over-request costs queue priority while an under-request costs the whole
    # job. Tighten them from `sacct -j <id> --format=Elapsed,MaxRSS` after this
    # run rather than guessing again.
    #   - mem 24G vs the 16G handed to MRIQC's own scheduler (--mem below):
    #     MRIQC's --mem is a nipype planning hint, not a ceiling, and ANTs peaks
    #     above it.
    #   - time 02:00:00 covers anat+func (each Caltech subject is 1 T1w + 1 rest
    #     bold); the previous 00:25:00 had no measurement behind it either.
    customized_text: |
        #SBATCH --partition=mit_normal
        #SBATCH --cpus-per-task=12
        #SBATCH --mem=24G
        #SBATCH --time=02:00:00
        #SBATCH --job-name=mriqc-nidm_bidsapp_${RUN_DATE}
# Necessary commands to be run first:
script_preamble: |
    source ~/.bashrc
    micromamba activate babs
    module load apptainer
# Where to run the jobs:
job_compute_space: "${COMPUTE_SPACE}"
required_files:
    "$INPUT_DATASET_#1":
        - "anat/*_T1w.nii*"
# Alert messages that might be found in log files of failed jobs:
alert_log_messages:
    stdout:
        - "ERROR:"
        - "Cannot allocate memory"
        - "Numerical result out of range"
        - "MRIQC execution failed"
        - "All subjects failed to process"
        - "csv2nidm tool not found"
